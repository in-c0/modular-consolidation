[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-consolidation"
version = "0.1.0"
description = "Budget-matched decomposition of modular continual learning: allocation, consolidation, retirement and reuse under hard capacity accounting"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
lm = [
  "torch>=2.4,<3",
  "transformers>=4.48,<6",
  "peft>=0.20,<1",
  "accelerate>=1.0,<3",
  "safetensors>=0.4,<1",
]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]
